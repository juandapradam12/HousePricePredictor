[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "house-price-predictor"
version = "1.1.0"
description = "Classical, Bayesian, and gradient-boosted models for Ames Housing prices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "pymc>=5.10",
  "arviz>=0.17",
  "lightgbm>=4.0",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "jupyter>=1.0", "ipykernel>=6.25"]
demo = ["streamlit>=1.28"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
